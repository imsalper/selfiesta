<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Selfiesta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0b14; --panel:#16131f; --panel2:#201c2c; --line:#2d2840;
  --text:#f5f2ff; --muted:#9a93b3;
  --accent1:#ff4f8b; --accent2:#ffb13b; --accent:linear-gradient(135deg,var(--accent1),var(--accent2));
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"Fredoka",system-ui,-apple-system,sans-serif;overflow:hidden}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
#app{display:flex;flex-direction:column;height:100dvh;max-width:900px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;gap:10px}
.logo{font-weight:700;font-size:26px;letter-spacing:.5px;background:var(--accent);-webkit-background-clip:text;background-clip:text;color:transparent;display:flex;align-items:center;gap:8px}
.logo span.cam{-webkit-text-fill-color:initial;font-size:24px}
.hbtns{display:flex;gap:8px}
.pill{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:500;display:flex;align-items:center;gap:6px;white-space:nowrap}
.pill.on{border-color:var(--accent1);box-shadow:0 0 0 1px var(--accent1) inset}
#aiStatus{font-size:12px;color:var(--muted)}
#aiStatus.ready{color:#7ee2a8}
#aiStatus.err{color:#ff8a8a}
main#stage{position:relative;flex:1;min-height:0;margin:0 12px;border-radius:22px;overflow:hidden;background:#000;box-shadow:0 10px 40px rgba(0,0,0,.5)}
#out{width:100%;height:100%;object-fit:contain;display:block}
#msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:12px;background:radial-gradient(circle at 50% 40%,#2a1d3d,#0d0b14)}
#msg .big{font-size:56px}
#msg h2{margin:0;font-size:22px}
#msg p{margin:0;color:var(--muted);max-width:420px;line-height:1.45}
#msg button{background:var(--accent);padding:12px 22px;border-radius:999px;font-weight:600;font-size:16px;color:#fff}
#count{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:140px;font-weight:700;color:#fff;text-shadow:0 6px 30px rgba(0,0,0,.6);pointer-events:none}
#count.show{display:flex;animation:pop .9s ease-out}
@keyframes pop{0%{transform:scale(1.6);opacity:0}30%{transform:scale(1);opacity:1}100%{opacity:.2}}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#flash.go{animation:flash .45s ease-out}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}
#hint{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:rgba(0,0,0,.55);backdrop-filter:blur(8px);padding:7px 14px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
#hint.show{opacity:1}
section#panel{padding:10px 0 calc(12px + env(safe-area-inset-bottom))}
.tabs{display:flex;justify-content:center;gap:6px;padding:0 12px 10px}
.tab{padding:8px 16px;border-radius:999px;font-weight:600;font-size:15px;color:var(--muted);background:transparent;border:1px solid transparent}
.tab.active{color:#fff;background:var(--panel2);border-color:var(--line)}
.opts{display:flex;gap:10px;overflow-x:auto;padding:4px 16px 8px;scrollbar-width:none;scroll-snap-type:x proximity;min-height:104px}
.opts::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;width:74px;display:flex;flex-direction:column;align-items:center;gap:5px;scroll-snap-align:start}
.chip .th{width:66px;height:66px;border-radius:18px;background:var(--panel2);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:32px;overflow:hidden;position:relative;transition:transform .15s}
.chip .th canvas{width:100%;height:100%;display:block}
.chip .nm{font-size:11.5px;color:var(--muted);text-align:center;line-height:1.1}
.chip.sel .th{border-color:transparent;box-shadow:0 0 0 3px var(--accent1),0 0 18px rgba(255,79,139,.45);transform:scale(1.04)}
.chip.sel .nm{color:#fff}
.chip.sel .th::after{content:"✓";position:absolute;right:4px;top:3px;font-size:12px;background:var(--accent1);color:#fff;border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center}
.chip.nock.sel .th::after{display:none}
.agebox{padding:6px 22px 8px;min-height:104px;display:flex;flex-direction:column;gap:10px;justify-content:center}
.agelabels{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.ageval{text-align:center;font-weight:600;font-size:15px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:10px;border-radius:999px;background:linear-gradient(90deg,#7fd6ff,#b9a7ff 50%,#c9b18a);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:#fff;border:4px solid var(--accent1);box-shadow:0 2px 10px rgba(0,0,0,.5);cursor:grab}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;border:4px solid var(--accent1)}
.presets{display:flex;gap:8px;justify-content:center}
.controls{display:flex;align-items:center;justify-content:space-between;padding:6px 34px 0}
.side{width:58px;height:58px;border-radius:18px;background:var(--panel2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:24px;overflow:hidden;padding:0}
.side img{width:100%;height:100%;object-fit:cover}
#shutter{width:82px;height:82px;border-radius:50%;padding:6px;background:var(--accent);box-shadow:0 6px 24px rgba(255,79,139,.4);transition:transform .1s}
#shutter:active{transform:scale(.92)}
#shutter span{display:block;width:100%;height:100%;border-radius:50%;background:#fff;border:4px solid var(--bg)}
.modal{position:fixed;inset:0;background:rgba(5,4,10,.88);backdrop-filter:blur(10px);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;z-index:10}
.modal.show{display:flex}
.modal img.photo{max-width:100%;max-height:70vh;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.mbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.mbtn{padding:12px 20px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-weight:600;font-size:15px}
.mbtn.primary{background:var(--accent);border:0;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;width:100%;max-width:800px;max-height:70vh;overflow:auto}
.grid img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;cursor:pointer}
.empty{color:var(--muted)}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:#fff;color:#111;padding:10px 18px;border-radius:999px;font-weight:600;opacity:0;transition:.3s;z-index:20;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:480px){#aiStatus{max-width:110px;overflow:hidden;text-overflow:ellipsis}.logo{font-size:22px}}
@media (max-height:700px){.opts,.agebox{min-height:90px}.chip .th{width:56px;height:56px;font-size:26px}.chip{width:62px}#shutter{width:70px;height:70px}.side{width:50px;height:50px}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo"><span class="cam">📸</span>Selfiesta</div>
    <div class="hbtns">
      <span class="pill" id="aiStatus">🤖 Yapay zeka yükleniyor…</span>
      <button class="pill" id="timerBtn" title="Zamanlayıcı">⏱️ <b id="timerTxt">Kapalı</b></button>
    </div>
  </header>

  <main id="stage">
    <canvas id="out" width="1280" height="720"></canvas>
    <div id="hint"></div>
    <div id="count"></div>
    <div id="flash"></div>
    <div id="msg">
      <div class="big">📸</div>
      <h2>Selfiesta'ya hoş geldin!</h2>
      <p>Manzara değiştir, sakal &amp; gözlük tak, yaşlan ya da gençleş — sonra çek! Başlamak için kameraya izin ver.</p>
      <button id="startBtn">Kamerayı Aç</button>
    </div>
  </main>

  <section id="panel">
    <nav class="tabs">
      <button class="tab active" data-tab="bg">🏞️ Manzara</button>
      <button class="tab" data-tab="fun">🥸 Eğlence</button>
      <button class="tab" data-tab="age">⏳ Yaş</button>
    </nav>
    <div class="opts" id="opts-bg"></div>
    <div class="opts" id="opts-fun" hidden></div>
    <div class="agebox" id="opts-age" hidden>
      <div class="ageval" id="ageVal">🙂 Normal</div>
      <input type="range" id="age" min="-100" max="100" value="0" step="1">
      <div class="agelabels"><span>👶 Gençleştir</span><span>Yaşlandır 👴</span></div>
      <div class="presets">
        <button class="pill" data-age="-100">👶 Bebek yüzü</button>
        <button class="pill" data-age="0">🙂 Normal</button>
        <button class="pill" data-age="100">👵 80 yaş</button>
      </div>
    </div>
    <div class="controls">
      <button class="side" id="galleryBtn" title="Galeri">🖼️</button>
      <button id="shutter" title="Fotoğraf çek (Boşluk)"><span></span></button>
      <button class="side" id="flipBtn" title="Kamerayı çevir">🔄</button>
    </div>
  </section>
</div>

<div class="modal" id="preview">
  <img class="photo" id="previewImg" alt="Çekilen fotoğraf">
  <div class="mbtns">
    <button class="mbtn primary" id="dlBtn">⬇️ İndir</button>
    <button class="mbtn" id="shareBtn">📤 Paylaş</button>
    <button class="mbtn" id="delBtn">🗑️ Sil</button>
    <button class="mbtn" id="closePrev">📸 Yeni Çek</button>
  </div>
</div>
<div class="modal" id="gallery">
  <h2 style="margin:0">🖼️ Galerin</h2>
  <div class="grid" id="grid"></div>
  <div class="mbtns"><button class="mbtn" id="closeGal">Kapat</button></div>
</div>
<div id="toast"></div>

<script type="module">
/* =========================================================
   Selfiesta — eğlenceli yapay zekalı selfie kamerası
   ========================================================= */
const MP = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
const MODEL_FACE = "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task";
const MODEL_SEG  = "https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_multiclass_256x256/float32/latest/selfie_multiclass_256x256.tflite";

const $ = s => document.querySelector(s);
const mk = (w,h) => { const c=document.createElement('canvas'); c.width=w; c.height=h; return c; };
const rngOf = seed => () => { seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; };
const lerp=(a,b,t)=>a+(b-a)*t;
const lerpP=(a,b,t)=>({x:lerp(a.x,b.x,t),y:lerp(a.y,b.y,t)});
const mid=(a,b)=>lerpP(a,b,.5);
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

const state = { bg:'none', stickers:new Set(), age:0, timer:0, facing:'user' };
const photos = [];

/* ---------------- Canvases ---------------- */
const out = $('#out'), octx = out.getContext('2d');
let W=1280, H=720;
let orig, gctxO, frame, fctx, layer, lctx, tmp, tctx, bgCanvas=null;
const DW=512; let DH=288;
let det, dctx;
let maskPerson, maskHair, maskSkin; // small canvases
let idPerson, idHair, idSkin;
let hasPerson=false, hasHair=false, hasSkin=false;
let faces = [];
let fakeFaces = null;

function setupCanvases(w,h){
  W=w; H=h; out.width=W; out.height=H;
  orig=mk(W,H); gctxO=orig.getContext('2d');
  frame=mk(W,H); fctx=frame.getContext('2d');
  layer=mk(W,H); lctx=layer.getContext('2d');
  tmp=mk(W,H); tctx=tmp.getContext('2d');
  DH=Math.round(DW*H/W);
  det=mk(DW,DH); dctx=det.getContext('2d',{willReadFrequently:true});
  const mkMask=()=>{const c=mk(DW,DH); const g=c.getContext('2d'); const id=g.createImageData(DW,DH); for(let i=0;i<id.data.length;i+=4){id.data[i]=id.data[i+1]=id.data[i+2]=255;} return [c,id];};
  [maskPerson,idPerson]=mkMask(); [maskHair,idHair]=mkMask(); [maskSkin,idSkin]=mkMask();
  bgCanvas=null;
}
setupCanvases(1280,720);

/* =========================================================
   MANZARALAR (kodla çizilen arka planlar)
   ========================================================= */
function grad(g,x0,y0,x1,y1,stops){const gr=g.createLinearGradient(x0,y0,x1,y1); stops.forEach((c,i)=>gr.addColorStop(i/(stops.length-1),c)); return gr;}
function radial(g,x,y,r,stops){const gr=g.createRadialGradient(x,y,0,x,y,r); stops.forEach(([o,c])=>gr.addColorStop(o,c)); return gr;}
function stars(g,w,h,n,r,maxY=1){for(let i=0;i<n;i++){const s=r()*1.6*(w/1280)+.3; g.globalAlpha=.3+r()*.7; g.fillStyle='#fff'; g.beginPath(); g.arc(r()*w,r()*h*maxY,s,0,7); g.fill();} g.globalAlpha=1;}
function ridge(g,w,h,base,amp,seg,r,fill,smooth){
  g.beginPath(); g.moveTo(0,h); let pts=[];
  for(let i=0;i<=seg;i++) pts.push([w*i/seg, base-amp*(smooth? (.5+.5*Math.sin(i*1.3+r()*2)) : r())]);
  g.lineTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++){ if(smooth){const m=[(pts[i-1][0]+pts[i][0])/2,(pts[i-1][1]+pts[i][1])/2]; g.quadraticCurveTo(pts[i-1][0],pts[i-1][1],m[0],m[1]);} else g.lineTo(pts[i][0],pts[i][1]); }
  g.lineTo(w,pts[pts.length-1][1]); g.lineTo(w,h); g.closePath(); g.fillStyle=fill; g.fill();
}
function pine(g,x,y,hh,color,snow){
  const w=hh*.42; g.fillStyle=color;
  for(let k=0;k<3;k++){const ty=y-hh*(.28+k*.26), by=y-hh*(k*.22); const ww=w*(1-k*.25);
    g.beginPath(); g.moveTo(x,ty-hh*.2); g.lineTo(x+ww/2,by); g.lineTo(x-ww/2,by); g.closePath(); g.fill();
    if(snow){g.fillStyle='rgba(255,255,255,.9)'; g.beginPath(); g.moveTo(x,ty-hh*.2); g.lineTo(x+ww*.18,ty-hh*.02); g.lineTo(x-ww*.18,ty-hh*.02); g.closePath(); g.fill(); g.fillStyle=color;}
  }
  g.fillRect(x-hh*.03,y-hh*.02,hh*.06,hh*.08);
}
function palm(g,x,y,hh,col){
  g.strokeStyle=col; g.lineCap='round'; g.lineWidth=hh*.045;
  g.beginPath(); g.moveTo(x,y); g.quadraticCurveTo(x+hh*.15,y-hh*.5,x+hh*.05,y-hh); g.stroke();
  const tx=x+hh*.05, ty=y-hh; g.fillStyle=col;
  for(let i=0;i<7;i++){const a=-Math.PI+i*Math.PI/6+.1, L=hh*.45;
    const ex=tx+Math.cos(a)*L, ey=ty+Math.sin(a)*L*.6+L*.35;
    g.beginPath(); g.moveTo(tx,ty); g.quadraticCurveTo(tx+Math.cos(a)*L*.5, ty-L*.25, ex, ey);
    g.quadraticCurveTo(tx+Math.cos(a)*L*.45, ty-L*.05, tx, ty); g.fill();}
}
function cloud(g,x,y,s,a){g.fillStyle=`rgba(255,255,255,${a})`; [[0,0,1],[.8,.1,.8],[-.8,.15,.75],[.35,-.35,.8],[-.35,-.3,.7]].forEach(([dx,dy,r])=>{g.beginPath(); g.arc(x+dx*s,y+dy*s,r*s,0,7); g.fill();});}

const BG_DRAW = {
  beach(g,w,h,r){
    g.fillStyle=grad(g,0,0,0,h*.6,['#2b1055','#7b2869','#d53369','#ff9a44','#ffd26f']); g.fillRect(0,0,w,h*.6);
    const sx=w*.62, sy=h*.57, sr=h*.11;
    g.fillStyle=radial(g,sx,sy,sr*4,[[0,'rgba(255,220,140,.8)'],[1,'rgba(255,150,80,0)']]); g.fillRect(0,0,w,h*.6);
    g.fillStyle='#ffe7a0'; g.beginPath(); g.arc(sx,sy,sr,0,7); g.fill();
    g.fillStyle=grad(g,0,h*.58,0,h,['#ff8a5c','#9b3f73','#3a1c71','#1a2a6c']); g.fillRect(0,h*.58,w,h*.42);
    for(let i=0;i<22;i++){const y=h*.6+i*h*.014; const ww=sr*2.4*(1-i/30)*(.6+r()*.5); g.fillStyle=`rgba(255,220,150,${.55-i*.02})`; g.fillRect(sx-ww/2+(r()-.5)*sr*.4,y,ww,1+h*.003);}
    cloud(g,w*.2,h*.18,h*.05,.25); cloud(g,w*.8,h*.12,h*.04,.2);
    g.fillStyle=grad(g,0,h*.8,0,h,['#f4d19b','#d9a066']); g.beginPath(); g.moveTo(0,h*.86); g.quadraticCurveTo(w*.5,h*.76,w,h*.9); g.lineTo(w,h); g.lineTo(0,h); g.fill();
    palm(g,w*.1,h*.95,h*.62,'#1a0d26'); palm(g,w*.93,h*.98,h*.45,'#1a0d26');
  },
  mountain(g,w,h,r){
    g.fillStyle=grad(g,0,0,0,h,['#3a7bd5','#7fb6f0','#dff1ff']); g.fillRect(0,0,w,h);
    g.fillStyle=radial(g,w*.8,h*.2,h*.35,[[0,'rgba(255,255,230,.95)'],[.15,'rgba(255,250,210,.7)'],[1,'rgba(255,255,255,0)']]); g.fillRect(0,0,w,h);
    cloud(g,w*.2,h*.15,h*.045,.85); cloud(g,w*.55,h*.1,h*.035,.7);
    const cols=['#8aa6c8','#6283ad','#3f5f86','#2a4665'];
    cols.forEach((c,k)=>{
      const base=h*(.55+k*.1), amp=h*(.32-k*.06);
      g.save(); ridge(g,w,h,base,amp,10+k*3,rngOf(k*99+3),c,false);
      if(k<2){g.clip(); g.fillStyle='rgba(255,255,255,.92)'; g.fillRect(0,0,w,base-amp*.62);} g.restore();
    });
    ridge(g,w,h,h*.93,h*.06,8,r,'#2f6b3a',true);
    for(let i=0;i<14;i++) pine(g,r()*w,h*(.93+r()*.07),h*(.12+r()*.08),'#1d4a2a');
  },
  space(g,w,h,r){
    g.fillStyle=radial(g,w*.5,h*.6,w*.8,[[0,'#1b2735'],[1,'#07070d']]); g.fillRect(0,0,w,h);
    g.globalCompositeOperation='lighter';
    [['rgba(140,60,255,.35)',.25,.35,.45],['rgba(0,160,255,.28)',.6,.7,.5],['rgba(255,60,160,.25)',.8,.25,.35]].forEach(([c,x,y,s])=>{g.fillStyle=radial(g,w*x,h*y,w*s,[[0,c],[1,'rgba(0,0,0,0)']]); g.fillRect(0,0,w,h);});
    g.globalCompositeOperation='source-over';
    stars(g,w,h,700,r);
    const px=w*.8, py=h*.28, pr=h*.15;
    g.strokeStyle='rgba(230,200,160,.55)'; g.lineWidth=h*.012;
    g.beginPath(); g.ellipse(px,py,pr*1.9,pr*.45,-.35,Math.PI,2*Math.PI); g.stroke();
    g.fillStyle=radial(g,px-pr*.4,py-pr*.4,pr*1.6,[[0,'#ffcf8a'],[.5,'#d9793b'],[1,'#5a2410']]); g.beginPath(); g.arc(px,py,pr,0,7); g.fill();
    g.beginPath(); g.ellipse(px,py,pr*1.9,pr*.45,-.35,0,Math.PI); g.stroke();
    g.fillStyle=radial(g,w*.15,h*.8,h*.07,[[0,'#eee'],[1,'#777']]); g.beginPath(); g.arc(w*.15,h*.8,h*.06,0,7); g.fill();
    g.strokeStyle=grad(g,w*.2,h*.1,w*.4,h*.25,['rgba(255,255,255,0)','rgba(255,255,255,.9)']); g.lineWidth=2; g.beginPath(); g.moveTo(w*.2,h*.1); g.lineTo(w*.4,h*.25); g.stroke();
  },
  city(g,w,h,r){
    g.fillStyle=grad(g,0,0,0,h,['#0b1026','#1e2a5a','#5b3a7a','#d0608a']); g.fillRect(0,0,w,h);
    stars(g,w,h,200,r,.5);
    g.fillStyle=radial(g,w*.18,h*.18,h*.2,[[0,'rgba(255,255,220,.5)'],[1,'rgba(255,255,220,0)']]); g.fillRect(0,0,w,h);
    g.fillStyle='#fff8dc'; g.beginPath(); g.arc(w*.18,h*.18,h*.07,0,7); g.fill();
    const layers=[['#2a2350',.45,.3],['#191633',.6,.45],['#0b0a1a',.78,.6]];
    layers.forEach(([c,top,lit],k)=>{

function makeHairPattern(base, dark, light, seed){
  const c=mk(96,96), g=c.getContext('2d'), r=rngOf(seed);
  g.fillStyle=base; g.fillRect(0,0,96,96);
  for(let i=0;i<900;i++){const x=r()*96, y=r()*96; g.strokeStyle=r()<.55?dark:light; g.globalAlpha=.5+r()*.5; g.lineWidth=.8+r()*.9;
    g.beginPath(); g.moveTo(x,y); g.quadraticCurveTo(x+(r()-.5)*4,y+3,x+(r()-.5)*5,y+5+r()*6); g.stroke();}
  return c;
}

function geo(lm){
  const P=i=>({x:lm[i].x*W, y:lm[i].y*H});
  let a=mid(P(33),P(133)), b=mid(P(263),P(362));
  if(a.x>b.x) [a,b]=[b,a];
  const d=Math.max(8,dist(a,b)), ang=Math.atan2(b.y-a.y,b.x-a.x), c=mid(a,b);
  const cos=Math.cos(-ang), sin=Math.sin(-ang);
  const loc=p=>{const dx=p.x-c.x, dy=p.y-c.y; return {x:(dx*cos-dy*sin)/d, y:(dx*sin+dy*cos)/d};};
  const down={x:-Math.sin(ang), y:Math.cos(ang)};
  return {P,L:a,R:b,d,ang,c,loc,down,iris:lm.length>473};
}

function drawBeard(g,G,gray){
  const {P,d,down}=G; const nose=P(1);
  const chinExtra={152:.42,148:.32,377:.32,176:.2,400:.2,149:.1,378:.1};
  const outer=JAW.map(i=>{const p=P(i); const e=.07; const x=p.x+(p.x-nose.x)*e, y=p.y+(p.y-nose.y)*e; const k=(chinExtra[i]||0)*d; return {x:x+down.x*k, y:y+down.y*k};});

  top.forEach(p=>g.lineTo(p.x,p.y)); g.closePath();
  const mc=mid(P(13),P(14));
  LIP_OUT.forEach((i,k)=>{const p=P(i); const x=p.x+(p.x-mc.x)*.12, y=p.y+(p.y-mc.y)*.25; k?g.lineTo(x,y):g.moveTo(x,y);}); g.closePath();
  const pat = gray?patGray:patBrown;
  g.shadowColor=gray?'rgba(120,120,120,.8)':'rgba(40,20,10,.9)'; g.shadowBlur=d*.08;
  g.fillStyle=pat; g.globalAlpha=.97; g.fill('evenodd');

function maskedLayer(src, mask, filter){
  lctx.globalCompositeOperation='source-over'; lctx.clearRect(0,0,W,H);
  lctx.filter=filter||'none'; lctx.drawImage(src,0,0); lctx.filter='none';
  lctx.globalCompositeOperation='destination-in';
  if(typeof mask==='function') mask(lctx); else lctx.drawImage(mask,0,0,W,H);
  lctx.globalCompositeOperation='source-over';
  return layer;
}
const FACE_OVAL=[10,338,297,332,284,251,389,356,454,323,361,288,397,365,379,378,400,377,152,148,176,149,150,136,172,58,132,93,234,127,162,21,54,103,67,109];
const EYE_L=[33,160,158,133,153,144], EYE_R=[362,385,387,263,373,380];
const BROW_L=[70,63,105,66,107], BROW_R=[336,296,334,293,300];
function polyPath(g,G,idx,grow=0){const pts=idx.map(G.P); const c=pts.reduce((a,p)=>({x:a.x+p.x/pts.length,y:a.y+p.y/pts.length}),{x:0,y:0});
  g.beginPath(); pts.forEach((p,i)=>{const x=p.x+(p.x-c.x)*grow, y=p.y+(p.y-c.y)*grow; i?g.lineTo(x,y):g.moveTo(x,y);}); g.closePath();}
function faceSkinMask(g){
  if(hasSkin){ g.drawImage(maskSkin,0,0,W,H); }
  else { g.fillStyle='#fff'; faces.forEach(lm=>{const G=geo(lm); polyPath(g,G,FACE_OVAL,-.02); g.fill();}); }
  g.globalCompositeOperation='destination-out'; g.fillStyle='#000';
  faces.forEach(lm=>{const G=geo(lm); [EYE_L,EYE_R].forEach(e=>{polyPath(g,G,e,.45); g.fill();}); polyPath(g,G,LIP_OUT,.08); g.fill(); [BROW_L,BROW_R].forEach(b=>{polyPath(g,G,b,.25); g.fill();});});
}
function enlargeEyes(G,k){
  const eyes=[G.iris? G.P(468):mid(G.P(33),G.P(133)), G.iris? G.P(473):mid(G.P(362),G.P(263))];
  for(const e of eyes){
    const r=G.d*.42, s=Math.ceil(r*2);
    tctx.clearRect(0,0,s,s);
    tctx.globalCompositeOperation='source-over';
    tctx.drawImage(orig, e.x-r/k, e.y-r/k, 2*r/k, 2*r/k, 0,0,s,s);
    tctx.globalCompositeOperation='destination-in';
    tctx.fillStyle=radial(tctx,r,r,r,[[0,'#000'],[.55,'#000'],[1,'rgba(0,0,0,0)']]); tctx.fillRect(0,0,s,s);
    tctx.globalCompositeOperation='source-over';
    fctx.drawImage(tmp,0,0,s,s,e.x-r,e.y-r,s,s);
  }
}
function wrinkles(g,G,a){
  const {P,loc}=G;
  const crease=(fn,w=.022)=>{ g.strokeStyle=`rgba(70,40,28,${.5*a})`; g.lineWidth=w; fn(); g.stroke();
    g.save(); g.translate(0,.014); g.strokeStyle=`rgba(255,238,225,${.22*a})`; g.lineWidth=w*.8; fn(); g.stroke(); g.restore(); };
  inLocal(g,G,()=>{
    g.lineCap='round'; g.filter='blur(0.6px)';
    const brow=Math.min(loc(P(105)).y,loc(P(334)).y), top=loc(P(10)).y;
    for(let i=0;i<4;i++){const y=lerp(brow-.18,top+.12,i/3); const w=.55-i*.03;
      crease(()=>{g.beginPath(); g.moveTo(-w,y+.04); g.quadraticCurveTo(-w/2,y-.04,0,y); g.quadraticCurveTo(w/2,y+.04,w,y-.03);});}
    for(const s of [-1,1]) crease(()=>{g.beginPath(); g.moveTo(s*.07,brow-.12); g.quadraticCurveTo(s*.09,brow-.02,s*.06,brow+.08);},.02);
    for(const [ci,s] of [[33,0],[263,0]]){ const oc=loc(P(ci)); const sg=Math.sign(oc.x);
      for(let k=-1;k<=1;k++) crease(()=>{g.beginPath(); g.moveTo(oc.x+sg*.06,oc.y+k*.05); g.quadraticCurveTo(oc.x+sg*.16,oc.y+k*.09,oc.x+sg*.24,oc.y+k*.15);},.018); }
    for(const [lo,ec] of [[145,-.5],[374,.5]]){ const p=loc(P(lo));
      crease(()=>{g.beginPath(); g.moveTo(p.x-.2,p.y+.05); g.quadraticCurveTo(p.x,p.y+.19,p.x+.2,p.y+.05);},.02);
      crease(()=>{g.beginPath(); g.moveTo(p.x-.15,p.y+.14); g.quadraticCurveTo(p.x,p.y+.26,p.x+.15,p.y+.14);},.016); }
    for(const [wing,corner] of [[129,61],[358,291]]){ const a1=loc(P(wing)), b1=loc(P(corner)); const sg=Math.sign(b1.x);
      crease(()=>{g.beginPath(); g.moveTo(a1.x+sg*.04,a1.y); g.quadraticCurveTo(b1.x+sg*.2,lerp(a1.y,b1.y,.5),b1.x+sg*.08,b1.y+.08);},.026);
      crease(()=>{g.beginPath(); g.moveTo(b1.x+sg*.04,b1.y+.07); g.quadraticCurveTo(b1.x+sg*.08,b1.y+.2,b1.x+sg*.04,b1.y+.32);},.02); }
    const ch=loc(P(17)); crease(()=>{g.beginPath(); g.moveTo(ch.x-.14,ch.y+.1); g.quadraticCurveTo(ch.x,ch.y+.05,ch.x+.14,ch.y+.1);},.02);
    g.filter='none';
    const r=rngOf(42);
    for(let i=0;i<9;i++){const x=(r()-.5)*1.4, y=r()<.5? (r()*.4+.3) : (brow-.3-r()*.3); g.fillStyle=`rgba(120,70,40,${.18*a})`; g.beginPath(); g.ellipse(x,y,.025+r()*.03,.02+r()*.025,r()*3,0,7); g.fill();}
    for(const x of [-.5,.5]){g.fillStyle=radial(g,x,.22,.3,[[0,`rgba(60,30,40,${.22*a})`],[1,'rgba(60,30,40,0)']]); g.beginPath(); g.ellipse(x,.22,.3,.16,0,0,7); g.fill();}
  });
}
function applyAge(){
  const a=state.age/100; if(a===0) return;
  if(a<0){
    const y=-a;
    faces.forEach(lm=>enlargeEyes(geo(lm),1+.22*y));
    if(faces.length||hasSkin){
      maskedLayer(frame, faceSkinMask, `blur(${(2+4*y)*W/1280}px) brightness(${1+.07*y}) saturate(${1+.1*y})`);
      fctx.globalAlpha=.9*y; fctx.drawImage(layer,0,0); fctx.globalAlpha=1;
    }
    faces.forEach(lm=>drawBlush(fctx,geo(lm),y*.8));
    if(hasHair){ maskedLayer(frame,maskHair,`saturate(${1+.3*y}) brightness(${1+.05*y})`); fctx.globalAlpha=y*.6; fctx.drawImage(layer,0,0); fctx.globalAlpha=1; }
  } else {
    if(faces.length||hasSkin){
      maskedLayer(frame, g=>{ if(hasSkin) g.drawImage(maskSkin,0,0,W,H); else {g.fillStyle='#fff'; faces.forEach(lm=>{polyPath(g,geo(lm),FACE_OVAL); g.fill();});} }, 'saturate(.6) sepia(.25) contrast(1.12) brightness(.96)');
      fctx.globalAlpha=.85*a; fctx.drawImage(layer,0,0); fctx.globalAlpha=1;
    }
    if(hasHair){ maskedLayer(frame,maskHair,'grayscale(1) brightness(1.9) contrast(.85)'); fctx.globalAlpha=Math.min(1,a*1.25); fctx.drawImage(layer,0,0); fctx.globalAlpha=1; }
    faces.forEach(lm=>{const G=geo(lm);
      if(!hasHair){ /* segmentasyon yoksa kaşları ağart */ fctx.save(); [BROW_L,BROW_R].forEach(b=>{polyPath(fctx,G,b,.3); fctx.fillStyle=`rgba(225,222,215,${.55*a})`; fctx.fill();}); fctx.restore(); }
      else { fctx.save(); [BROW_L,BROW_R].forEach(b=>{polyPath(fctx,G,b,.2); fctx.fillStyle=`rgba(215,212,205,${.5*a})`; fctx.filter='blur(2px)'; fctx.fill();}); fctx.restore(); }
      wrinkles(fctx,G,a);
    });
  }
}

let faceLM=null, segmenter=null;
const aiStatus=$('#aiStatus');
async function loadAI(){
  try{
    let vision;
    try{ vision = await import(MP+"/vision_bundle.mjs"); }
    catch(e){ vision = await import(MP); }
    const {FilesetResolver, FaceLandmarker, ImageSegmenter} = vision;
    const fs = await FilesetResolver.forVisionTasks(MP+"/wasm");
    const make = async (Cls, opts) => { try{ return await Cls.createFromOptions(fs,{...opts,baseOptions:{...opts.baseOptions,delegate:'GPU'}}); } catch(e){ console.warn('GPU yok, CPU deneniyor',e); return await Cls.createFromOptions(fs,{...opts,baseOptions:{...opts.baseOptions,delegate:'CPU'}}); } };
    [faceLM, segmenter] = await Promise.all([
      make(FaceLandmarker,{baseOptions:{modelAssetPath:MODEL_FACE}, runningMode:'VIDEO', numFaces:3}),
      make(ImageSegmenter,{baseOptions:{modelAssetPath:MODEL_SEG}, runningMode:'VIDEO', outputConfidenceMasks:true, outputCategoryMask:false}),
    ]);
    aiStatus.textContent='🤖 Yapay zeka hazır'; aiStatus.className='pill ready';
    setTimeout(()=>{aiStatus.style.display='none';},2500);
  }catch(e){
    console.error(e);
    aiStatus.textContent='⚠️ Efektler için internet gerekli'; aiStatus.className='pill err';
  }
}

function fillMask(id, arr, fn){ const d=id.data; for(let i=0,j=3;i<arr.length;i++,j+=4) d[j]=fn(arr[i]); }
let lastTs=0;
function detect(){
  const needSeg = state.bg!=='none' || state.age!==0;
  const needFace = state.stickers.size>0 || state.age!==0;
  dctx.drawImage(orig,0,0,DW,DH);
  let ts=performance.now(); if(ts<=lastTs) ts=lastTs+1; lastTs=ts;
  if(fakeFaces){ faces=fakeFaces; }
  else if(faceLM && needFace){ try{ const r=faceLM.detectForVideo(det,ts); faces=r.faceLandmarks||[]; }catch(e){console.warn(e); faces=[];} }
  else faces=[];
  hasPerson=hasHair=hasSkin=false;
  if(segmenter && needSeg){
    try{
      segmenter.segmentForVideo(det, ts, res=>{
        const m=res.confidenceMasks; if(!m||!m.length) return;
        const w=m[0].width, h=m[0].height; if(w!==DW||h!==DH) return;
        if(state.bg!=='none'){ const bgA=m[0].getAsFloat32Array(); fillMask(idPerson,bgA,v=>{const p=1-v; return p<.25?0:p>.7?255:(p-.25)/.45*255;}); maskPerson.getContext('2d').putImageData(idPerson,0,0); hasPerson=true; }
        if(state.age!==0){
          if(m[1]){ fillMask(idHair,m[1].getAsFloat32Array(),v=>v<.3?0:Math.min(255,(v-.3)*400)); maskHair.getContext('2d').putImageData(idHair,0,0); hasHair=true; }
          if(m[3]){ fillMask(idSkin,m[3].getAsFloat32Array(),v=>v<.3?0:Math.min(255,(v-.3)*400)); maskSkin.getContext('2d').putImageData(idSkin,0,0); hasSkin=true; }
        }
      });
    }catch(e){console.warn(e);}
  }
}

const video=document.createElement('video'); video.playsInline=true; video.muted=true;
let stream=null, running=false;
async function startCamera(){
  try{
    if(stream) stream.getTracks().forEach(t=>t.stop());
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:state.facing, width:{ideal:1280}, height:{ideal:720}}, audio:false});
    video.srcObject=stream; await video.play();
    const w=video.videoWidth||1280, h=video.videoHeight||720;
    if(w!==W||h!==H) setupCanvases(w,h);
    $('#msg').style.display='none';
    if(!running){ running=true; requestAnimationFrame(loop); }
    if(!faceLM && !loadAI.started){ loadAI.started=true; loadAI(); }
  }catch(e){
    console.error(e);
    const m=$('#msg'); m.style.display='flex';
    m.innerHTML = `<div class="big">🙈</div><h2>Kameraya ulaşılamadı</h2><p>Tarayıcının adres çubuğundaki kamera simgesinden izin ver. Uygulamayı <b>Google Chrome</b> ile açman önerilir.<br><small>(${e.name||''})</small></p><button id="retry">Tekrar Dene</button>`;
    $('#retry').onclick=startCamera;
  }
}
function loop(t){
  if(video.readyState>=2){
    gctxO.save();
    if(state.facing==='user'){ gctxO.translate(W,0); gctxO.scale(-1,1); }
    gctxO.drawImage(video,0,0,W,H); gctxO.restore();
    detect();
    render(t);
  } else if(fakeFaces){ render(t); }
  requestAnimationFrame(loop);
}
function render(t){
  fctx.drawImage(orig,0,0);
  applyAge();
  if(state.bg==='none' || !hasPerson){ octx.drawImage(frame,0,0); }
  else {
    if(state.bg==='blur'){ octx.filter=`blur(${18*W/1280}px)`; octx.drawImage(orig,-20,-20,W+40,H+40); octx.filter='none'; }
    else { if(!bgCanvas||bgCanvas.id!==state.bg){ bgCanvas=makeBg(state.bg,W,H); bgCanvas.id=state.bg; } octx.drawImage(bgCanvas,0,0); }
    octx.drawImage(maskedLayer(frame,maskPerson),0,0);
  }
  if(!patBrown){ patBrown=octx.createPattern(hairBrown,'repeat'); patGray=octx.createPattern(hairGray,'repeat'); }
  const gray = state.age>35;
  faces.forEach(lm=>{
    const G=geo(lm), S=state.stickers;
    if(S.has('blush')) drawBlush(octx,G,1);
    if(S.has('beard')) drawBeard(octx,G,gray);
    if(S.has('mustache')) drawMustache(octx,G,gray);
    if(S.has('tongue')) drawTongue(octx,G);
    if(S.has('clown')) drawClown(octx,G);
    for(const gl of ['sunglasses','nerd','heartglasses']) if(S.has(gl)) drawGlasses(octx,G,gl);
    for(const hd of ['party','crown','tophat','cat','bunny']) if(S.has(hd)) drawHead(octx,G,hd,t);
    if(S.has('hearts')) drawHearts(octx,G,t);
  });
  updateHint();
}
let hintTimer=0;
function updateHint(){
  const h=$('#hint');
  const wantsFace = (state.stickers.size>0 || state.age!==0) && faceLM;
  const show = wantsFace && faces.length===0;
  if(show){ if(!hintTimer) hintTimer=performance.now(); if(performance.now()-hintTimer>700){ h.textContent='🙂 Yüzünü kameraya göster'; h.classList.add('show'); } }
  else { hintTimer=0; h.classList.remove('show'); }
}

$('#dlBtn').onclick=()=>{ const a=document.createElement('a'); a.href=current.url; a.download=current.name; a.click(); toast('⬇️ İndirildi: '+current.name); };
$('#shareBtn').onclick=async()=>{ try{ const file=new File([current.blob],current.name,{type:'image/jpeg'}); if(navigator.canShare&&navigator.canShare({files:[file]})) await navigator.share({files:[file],title:'Selfiesta'}); else toast('Bu tarayıcı paylaşmayı desteklemiyor, İndir\'i kullan'); }catch(e){} };
$('#delBtn').onclick=()=>{ const i=photos.indexOf(current); if(i>=0){ URL.revokeObjectURL(current.url); photos.splice(i,1);} $('#preview').classList.remove('show'); updateGalleryBtn(); toast('🗑️ Silindi'); };
function updateGalleryBtn(){ const b=$('#galleryBtn'); b.innerHTML = photos.length? `<img src="${photos[0].url}" alt="">` : '🖼️'; }
$('#galleryBtn').onclick=()=>{
  const g=$('#grid'); g.innerHTML='';
  if(!photos.length) g.innerHTML='<p class="empty">Henüz fotoğraf yok — hadi bir tane çek! 📸</p>';
  photos.forEach(ph=>{const im=document.createElement('img'); im.src=ph.url; im.onclick=()=>openPreview(ph); g.appendChild(im);});
  $('#gallery').classList.add('show');
};
$('#closeGal').onclick=()=>$('#gallery').classList.remove('show');

// Kamera iznini otomatik dene
if(navigator.mediaDevices?.getUserMedia){ startCamera(); }
else { $('#msg').innerHTML='<div class="big">😕</div><h2>Tarayıcı kamerayı desteklemiyor</h2><p>Lütfen uygulamayı Google Chrome ile aç.</p>'; }

// test kancası
window.__selfiesta={state,setFakeFaces:f=>{fakeFaces=f;},setAge,syncChips};
</script>
